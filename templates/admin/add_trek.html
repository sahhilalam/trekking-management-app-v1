{% extends "admin/layout.html" %}

{% block title %}
Add Trek
{% endblock title %}

{% block main_content %}
<h3>Add Trek</h3>
<hr>
<form action="" method="POST" enctype="multipart/form-data">

    <label>Trek Name</label>

    <input class="form-control" type="text" name="trek_name" required>

    <label>Location</label>

    <input class="form-control" type="text" name="location" required>

    <label>Difficulty</label>

    <select class="form-control" name="difficulty" required>

        <option value="Easy">Easy</option>

        <option value="Moderate">Moderate</option>

        <option value="Hard">Hard</option>

    </select>

    <label>Duration (Days)</label>

    <input class="form-control" type="number" name="duration" min="1" required>

    <label>Available Slots</label>

    <input class="form-control" type="number" name="available_slots" min="1" required>

    <label>Start Date</label>

    <input class="form-control" type="date" name="start_date" required>

    <label>End Date</label>

    <input class="form-control" type="date" name="end_date" required>

    <label>Status</label>

    <select class="form-control" name="status" required>

        <option value="Open">Open</option>

        <option value="Closed">Closed</option>

        <option value="Completed">Completed</option>

    </select>

    <label>Description</label>

    <textarea class="form-control"

              rows="5"

              name="description"></textarea>

    <label>Trek Image (Optional)</label>

    <input class="form-control"

           type="file"

           name="image"

           accept="image/*">

    <button class="btn btn-success mt-3">

        Create Trek

    </button>

</form>
{% endblock main_content %}
