{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}

<div class="login-page">
    <div class="left-panel">
        <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
        <h1>Manage Treks</h1>
        <h2>Empower Adventures</h2>
        <p>A complete trekking management platform for managing treks, staffs and users.</p>
    </div>
    <div class="right-panel">
        <div class="login-box">
            <h2>Register</h2>

            <form action="" method="post">
 
                <input class="form-control" name="name" type="text" placeholder="Name" required>

                <input class="form-control" name="email" type="email" placeholder="Email" required>

                <input class="form-control" name="password" type="password" placeholder="Password" required>
 
                <select class="form-control" name="role" required>
                    <option value="" selected disabled>Select Role</option>
                    <option value="User">User</option>
                    <option value="Staff">Staff</option>
                </select>

                <input class="form-control" name="phone" type="tel" placeholder="+91xxxxx" required pattern="^\+91\d{10}$">

                <button class="submit">Register</button>

            </form>
            
            <p class="exist">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>
    </div>
</div>

{% endblock %}
